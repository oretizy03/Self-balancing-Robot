[env]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = default, send_on_enter
monitor_echo = yes
board_build.partitions = huge_app.csv
lib_deps =
	adafruit/Adafruit MPU6050@^2.2.9
	adafruit/Adafruit Unified Sensor@^1.1.15
	adafruit/Adafruit BusIO@^1.17.4
	https://github.com/aed3/PS4-esp32

[env:ps4_cal]
build_src_filter = -<*> +<ps4_cal_tool.cpp>

[env:ps4_drive]
build_src_filter = -<*> +<ps4_drive.cpp>