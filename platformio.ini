; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = default, send_on_enter
monitor_echo = yes
lib_deps = 
	adafruit/Adafruit MPU6050@^2.2.9
	adafruit/Adafruit Unified Sensor@^1.1.15
	adafruit/Adafruit BusIO@^1.17.4
	https://github.com/aed3/PS4-esp32
	flamethr0wer/PS4Arduino@^1.0.1

[env:ps4_cal]
build_src_filter = -<*> +<ps4_cal_tool.cpp>
lib_deps = flamethr0wer/PS4Arduino@^1.0.1

[env:ps4_drive]
build_src_filter = -<*> +<ps4_drive.cpp>
lib_deps = flamethr0wer/PS4Arduino@^1.0.1
